[package]
name = "ioscpy"
version = "0.3.0-dream.7"
edition = "2021"
rust-version = "1.74"
description = "macOS CLI to mirror and control a jailbroken iPhone over USB"
authors = ["Lautaro Villarreal Culic' <lautaro@lautarovculic.com> (https://lautarovculic.com)"]
license = "MIT"
homepage = "https://lautarovculic.com"
repository = "https://github.com/lautarovculic/ioscpy"
readme = "../README.md"
keywords = ["ios", "jailbreak", "mirroring", "usbmux", "macos"]
categories = ["command-line-utilities"]

[[bin]]
name = "ioscpy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
minifb = { path = "third_party/minifb" }
zune-jpeg = "0.4"
# Decodes the bundled sidebar icon PNGs (host/assets/icons/) at startup.
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"
cocoa = "0.25"

# Host clipboard on Linux/Windows (macOS uses NSPasteboard directly). Text only,
# so image-data is dropped; wayland-data-control adds Wayland alongside X11.
# openh264 is the software H.264 decoder used off macOS, since the VideoToolbox
# shim in h264_decoder.m is mac-only.
[target.'cfg(not(target_os = "macos"))'.dependencies]
openh264 = "0.9"

# Linux / other Unix (not macOS): native Wayland clipboard via wl-clipboard-rs.
# wayland-client (same 0.31 line wl-clipboard-rs already pulls in) is used only
# to probe the compositor for server-side decoration support (see wayland_compat.rs).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
wayland-client = "0.31"

# Windows: Win32 clipboard (the wayland-data-control feature pulls wl-clipboard-rs,
# which doesn't build here), plus getrandom for the handshake nonce (no /dev/urandom).
[target.'cfg(target_os = "windows")'.dependencies]
arboard = { version = "3", default-features = false }
# 0.3 (uses getrandom::fill) aligns with the version already in the tree, avoiding
# an extra major line in Cargo.lock.
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[lints.clippy]
all = "warn"
